version: 2
updates:
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "monthly"
      labels:
          - "dependencies"
          - "github-actions"
      open-pull-requests-limit: 1

    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "monthly"
      labels:
          - "dependencies"
      open-pull-requests-limit: 2
      versioning-strategy: increase
