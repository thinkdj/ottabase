name: PR Preview Deployments

# A PR preview is `otta deploy <app> --ci --preview pr-<N>`: the app's env.preview block deployed as its
# own Worker, <name>-pr-<N>, removed again by `otta deploy --all --delete-preview pr-<N>` when the PR
# closes. Which apps get previews is each cloudflare-config.json's previewDeployable; nothing here
# repeats it. Opt-in: #deploy or #preview in the PR title or description, or a manual run.
#
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, and the placeholder values of each app's
# env.preview block (D1_PREVIEW_DATABASE_ID, ...). PRs from forks get no secrets, so they get no preview.
on:
    workflow_dispatch:
        inputs:
            pr_number:
                description: "PR number for preview naming/cleanup alignment (optional)"
                required: false
                type: string
    pull_request:
        types: [opened, synchronize, reopened, closed]

concurrency:
    group: pr-preview-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: true

# cancel-in-progress (concurrency block above) is handled by the Actions runner
# and does not require actions: write — contents: read is sufficient.
permissions:
    contents: read

jobs:
    # Preview deploy is opt-in: run on manual dispatch or when PR title/body contains #deploy/#preview.
    # The preview id is decided here once: pr-<N>, or manual-<run> for a manual run without a PR number.
    check-preview-requested:
        runs-on: ubuntu-24.04
        outputs:
            preview_requested: ${{ steps.check.outputs.preview_requested }}
            preview_id: ${{ steps.check.outputs.preview_id }}
        steps:
            - name: Check preview trigger markers
              id: check
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  PR_ACTION: ${{ github.event.action || '' }}
                  PR_TITLE: ${{ github.event_name == 'pull_request' && github.event.pull_request.title || '' }}
                  PR_BODY: ${{ github.event_name == 'pull_request' && github.event.pull_request.body || '' }}
                  PR_NUMBER: ${{ github.event.pull_request.number || '' }}
                  PR_NUMBER_INPUT: ${{ inputs.pr_number }} # free text: validated, never interpolated
                  RUN_NUMBER: ${{ github.run_number }}
                  # A PR from a fork gets no secrets, so it cannot get a preview: say so instead of failing.
                  FROM_FORK:
                      ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name !=
                      github.repository }}
              run: |
                  if [ -n "$PR_NUMBER" ]; then
                    echo "preview_id=pr-${PR_NUMBER}" >> $GITHUB_OUTPUT
                  elif [ -n "$PR_NUMBER_INPUT" ]; then
                    [[ "$PR_NUMBER_INPUT" =~ ^[0-9]+$ ]] || { echo "❌ pr_number must be numeric"; exit 1; }
                    echo "preview_id=pr-${PR_NUMBER_INPUT}" >> $GITHUB_OUTPUT
                  else
                    echo "preview_id=manual-${RUN_NUMBER}" >> $GITHUB_OUTPUT
                  fi

                  # Closed PR events are cleanup-only; no preview deploy needed.
                  if [ "$EVENT_NAME" = "pull_request" ] && [ "$PR_ACTION" = "closed" ]; then
                    echo "preview_requested=false" >> $GITHUB_OUTPUT
                    echo "🧹 PR closed: the cleanup job removes its preview Workers"
                    exit 0
                  fi

                  # Manual workflow runs are explicitly opt-in.
                  if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
                    echo "preview_requested=true" >> $GITHUB_OUTPUT
                    echo "✅ Manual preview requested via workflow_dispatch"
                    exit 0
                  fi

                  if [ "$FROM_FORK" = "true" ]; then
                    echo "preview_requested=false" >> $GITHUB_OUTPUT
                    echo "::notice::No preview for a PR from a fork: it gets no secrets. To preview it, push the branch to this repository."
                    exit 0
                  fi

                  if printf '%s\n' "$PR_TITLE" "$PR_BODY" | grep -qiE '#deploy|#preview'; then
                    echo "preview_requested=true" >> $GITHUB_OUTPUT
                    echo "✅ Preview requested: found #deploy or #preview in PR title/description"
                  else
                    echo "preview_requested=false" >> $GITHUB_OUTPUT
                    echo "⏭️  Skipping PR preview: add #deploy or #preview to PR title/description, or run manually"
                  fi

    # Which apps get a preview: `otta deploy --all --plan --preview`, from previewDeployable.
    plan:
        needs: check-preview-requested
        if: github.event.action != 'closed' && needs.check-preview-requested.outputs.preview_requested == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        name: Plan previews
        outputs:
            matrix: ${{ steps.plan.outputs.matrix }}
            has-apps: ${{ steps.plan.outputs.has-apps }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts=false

            - name: Plan
              id: plan
              env:
                  PREVIEW_ID: ${{ needs.check-preview-requested.outputs.preview_id }}
              run: |
                  # --force: a preview is asked for explicitly, a #skipdeploy commit does not cancel it.
                  MATRIX=$(node packages/cli/bin/otta.mjs deploy --all --plan --preview "$PREVIEW_ID" --force)
                  echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
                  COUNT=$(echo "$MATRIX" | jq '.include | length')
                  echo "has-apps=$([ "$COUNT" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

    # The workspace packages, built once and cached for every app's job.
    build-packages:
        needs: plan
        if: needs.plan.outputs.has-apps == 'true'
        uses: ./.github/workflows/build-packages.yml
        # Only the remote-cache secrets; absent (fork PRs) => turbo runs local-only.
        secrets:
            TURBO_API: ${{ secrets.TURBO_API }}
            TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
            TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

    deploy-preview:
        needs: [check-preview-requested, plan, build-packages]
        if: needs.plan.outputs.has-apps == 'true' && github.event.action != 'closed'
        runs-on: ubuntu-24.04
        timeout-minutes: 25
        name: Preview ${{ matrix.app }}
        strategy:
            matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
            fail-fast: false

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts=false

            - name: Restore built packages
              uses: actions/cache/restore@v6
              with:
                  path: |
                      packages/*/dist
                      packages/pro/*/dist
                      .turbo
                  key: ${{ needs.build-packages.outputs.cache-key }}
                  fail-on-cache-miss: true

            - name: Cache Next.js builds
              uses: actions/cache@v6
              with:
                  path: apps/${{ matrix.app }}/.next/cache
                  key: ${{ runner.os }}-nextjs-${{ matrix.app }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-nextjs-${{ matrix.app }}-${{ hashFiles('pnpm-lock.yaml') }}-
                      ${{ runner.os }}-nextjs-${{ matrix.app }}-

            # env.preview deployed as the Worker <name>-<id>; the URL, health and summary come from otta deploy.
            # node runs the CLI directly: OTTA_DEPLOY_VALUES is read and removed from the environment before
            # anything else loads (packages/cli/bin/otta.mjs).
            - name: Deploy preview
              env:
                  APP: ${{ matrix.app }}
                  PREVIEW_ID: ${{ needs.check-preview-requested.outputs.preview_id }}
                  OTTA_DEPLOY_VALUES: ${{ toJson(secrets) }}
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  NODE_ENV: production
              run: node packages/cli/bin/otta.mjs deploy "$APP" --ci --preview "$PREVIEW_ID" --skip-packages --force

    # Remove the PR's preview Workers when it closes (merged or not). An absent Worker is not an error.
    cleanup-preview:
        needs: check-preview-requested
        # A fork's PR never had a preview (and gets no secrets to delete one with).
        if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-24.04
        name: Cleanup preview workers
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts=false

            - name: Delete preview workers
              env:
                  PREVIEW_ID: ${{ needs.check-preview-requested.outputs.preview_id }}
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: node packages/cli/bin/otta.mjs deploy --all --delete-preview "$PREVIEW_ID"
