name: PR Preview Deployments

# A preview is `otta deploy <app> --ci --preview <id>`: the app's env.preview block deployed as its own
# Worker, <name>-<id>, and removed again with `otta deploy --all --delete-preview <id>`. Which apps get
# previews is each cloudflare-config.json's previewDeployable; nothing here repeats it.
#
# - A PR, opt-in with #deploy or #preview in its title or description: <id> is pr-<N>, removed when the PR
#   closes (merged or not).
# - A manual run: pr-<pr_number> when given, else br-<branch>-<hash> (one per branch, each run replaces it),
#   removed when the branch is deleted, or by a manual run with `cleanup` ticked.
#
# The deploy job runs in the `preview` GitHub Environment: add required reviewers there (Settings →
# Environments) and a PR's code gets the secrets only once someone approves the run.
#
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, and the placeholder values of each app's env.preview
# block (D1_PREVIEW_DATABASE_ID, ...). PRs from forks get no secrets, so they get a notice, not a preview.
on:
    workflow_dispatch:
        inputs:
            pr_number:
                description:
                    "Name the preview after this PR (pr-<N>), so the PR's close removes it. Empty: after the branch"
                required: false
                type: string
            cleanup:
                description: "Delete this run's preview instead of deploying it"
                required: false
                default: false
                type: boolean
    pull_request:
        types: [opened, synchronize, reopened, closed]
    # A deleted branch takes its manual preview (br-<branch>-<hash>) with it.
    delete:

concurrency:
    group: pr-preview-${{ github.event.pull_request.number || inputs.pr_number || github.event.ref || github.ref_name }}
    cancel-in-progress: true

# cancel-in-progress (concurrency block above) is handled by the Actions runner
# and does not require actions: write — contents: read is sufficient.
permissions:
    contents: read

jobs:
    # What this run does (deploy, cleanup or nothing) and for which preview id, decided once, with no secrets.
    check-preview-requested:
        runs-on: ubuntu-24.04
        outputs:
            action: ${{ steps.check.outputs.action }}
            preview_id: ${{ steps.check.outputs.preview_id }}
        steps:
            - name: Decide the preview and what to do with it
              id: check
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  PR_ACTION: ${{ github.event.action || '' }}
                  PR_TITLE: ${{ github.event_name == 'pull_request' && github.event.pull_request.title || '' }}
                  PR_BODY: ${{ github.event_name == 'pull_request' && github.event.pull_request.body || '' }}
                  PR_NUMBER: ${{ github.event.pull_request.number || '' }}
                  PR_NUMBER_INPUT: ${{ inputs.pr_number }} # free text: validated, never interpolated
                  CLEANUP: ${{ inputs.cleanup }}
                  BRANCH: ${{ github.ref_name }} # free text: slugged, never interpolated
                  DELETED_REF: ${{ github.event_name == 'delete' && github.event.ref || '' }}
                  DELETED_REF_TYPE: ${{ github.event_name == 'delete' && github.event.ref_type || '' }}
                  # A PR from a fork gets no secrets, so it cannot get a preview: say so instead of failing.
                  FROM_FORK:
                      ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name !=
                      github.repository }}
              run: |
                  # br-<up to 20 slug characters>-<6 hex of the full name>: a valid Worker name suffix, stable
                  # per branch, and two branches with the same slug still get two previews.
                  branch_id() {
                    local base hash
                    base=$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-' | sed -e 's/^-*//' | cut -c1-20 | sed -e 's/-*$//')
                    hash=$(printf '%s' "$1" | sha256sum | cut -c1-6)
                    printf 'br-%s%s' "${base:+$base-}" "$hash"
                  }
                  decide() { echo "preview_id=$1" >> "$GITHUB_OUTPUT"; echo "action=$2" >> "$GITHUB_OUTPUT"; echo "$3"; }

                  case "$EVENT_NAME" in
                    pull_request)
                      ID="pr-${PR_NUMBER}"
                      if [ "$FROM_FORK" = "true" ]; then
                        decide "$ID" none "::notice::No preview for a PR from a fork: it gets no secrets. To preview it, push the branch to this repository."
                      elif [ "$PR_ACTION" = "closed" ]; then
                        decide "$ID" cleanup "🧹 PR closed: its preview Workers go"
                      elif printf '%s\n' "$PR_TITLE" "$PR_BODY" | grep -qiE '#deploy|#preview'; then
                        decide "$ID" deploy "✅ Preview requested: #deploy or #preview in the PR title or description"
                      else
                        decide "$ID" none "⏭️  No preview: add #deploy or #preview to the PR title or description, or run this workflow by hand"
                      fi
                      ;;
                    workflow_dispatch)
                      if [ -n "$PR_NUMBER_INPUT" ]; then
                        [[ "$PR_NUMBER_INPUT" =~ ^[0-9]+$ ]] || { echo "::error::pr_number must be numeric"; exit 1; }
                        ID="pr-${PR_NUMBER_INPUT}"
                      else
                        ID=$(branch_id "$BRANCH")
                      fi
                      if [ "$CLEANUP" = "true" ]; then
                        decide "$ID" cleanup "🧹 Manual cleanup of ${ID}"
                      else
                        decide "$ID" deploy "✅ Manual preview ${ID} (branch ${BRANCH})"
                      fi
                      ;;
                    delete)
                      if [ "$DELETED_REF_TYPE" = "branch" ]; then
                        decide "$(branch_id "$DELETED_REF")" cleanup "🧹 Branch ${DELETED_REF} deleted: its manual preview goes, if it had one"
                      else
                        decide "" none "A tag was deleted: nothing to do"
                      fi
                      ;;
                    *)
                      decide "" none "Nothing to do for ${EVENT_NAME}"
                      ;;
                  esac

    # Which apps get a preview: `otta deploy --all --plan --preview`, from previewDeployable.
    plan:
        needs: check-preview-requested
        if: needs.check-preview-requested.outputs.action == 'deploy'
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        name: Plan previews
        outputs:
            matrix: ${{ steps.plan.outputs.matrix }}
            has-apps: ${{ steps.plan.outputs.has-apps }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts=false

            - name: Plan
              id: plan
              env:
                  PREVIEW_ID: ${{ needs.check-preview-requested.outputs.preview_id }}
              run: |
                  # --force: a preview is asked for explicitly, a #skipdeploy commit does not cancel it.
                  MATRIX=$(node packages/cli/bin/otta.mjs deploy --all --plan --preview "$PREVIEW_ID" --force)
                  echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
                  COUNT=$(echo "$MATRIX" | jq '.include | length')
                  echo "has-apps=$([ "$COUNT" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

    # The workspace packages, built once and cached for every app's job.
    build-packages:
        needs: plan
        if: needs.plan.outputs.has-apps == 'true'
        uses: ./.github/workflows/build-packages.yml
        # Only the remote-cache secrets; absent (fork PRs) => turbo runs local-only.
        secrets:
            TURBO_API: ${{ secrets.TURBO_API }}
            TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
            TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

    deploy-preview:
        needs: [check-preview-requested, plan, build-packages]
        if: needs.plan.outputs.has-apps == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 25
        name: Preview ${{ matrix.app }}
        # Required reviewers on this environment gate every preview before its code sees a secret; the link
        # is the preview's URL.
        environment:
            name: preview
            url: ${{ steps.deploy.outputs.url }}
        strategy:
            matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
            fail-fast: false

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts=false

            - name: Restore built packages
              uses: actions/cache/restore@v6
              with:
                  path: |
                      packages/*/dist
                      packages/pro/*/dist
                      .turbo
                  key: ${{ needs.build-packages.outputs.cache-key }}
                  fail-on-cache-miss: true

            # Next.js's incremental cache, for the apps the plan says are Next.js.
            - name: Cache Next.js builds
              if: matrix.appType == 'nextjs'
              uses: actions/cache@v6
              with:
                  path: apps/${{ matrix.app }}/.next/cache
                  key: ${{ runner.os }}-nextjs-${{ matrix.app }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-nextjs-${{ matrix.app }}-${{ hashFiles('pnpm-lock.yaml') }}-
                      ${{ runner.os }}-nextjs-${{ matrix.app }}-

            # env.preview deployed as the Worker <name>-<id>; the URL, health and summary come from otta deploy.
            # node runs the CLI directly: OTTA_DEPLOY_VALUES is read and removed from the environment before
            # anything else loads (packages/cli/bin/otta.mjs).
            - name: Deploy preview
              id: deploy
              env:
                  APP: ${{ matrix.app }}
                  PREVIEW_ID: ${{ needs.check-preview-requested.outputs.preview_id }}
                  OTTA_DEPLOY_VALUES: ${{ toJson(secrets) }}
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  NODE_ENV: production
              run: node packages/cli/bin/otta.mjs deploy "$APP" --ci --preview "$PREVIEW_ID" --skip-packages --force

    # Remove a preview's Workers (a closed PR, a deleted branch, a manual cleanup). One API call first: a PR or a
    # branch that never had a preview costs no install. An absent Worker is not an error.
    cleanup-preview:
        needs: check-preview-requested
        if: needs.check-preview-requested.outputs.action == 'cleanup'
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        name: Cleanup preview workers
        env:
            PREVIEW_ID: ${{ needs.check-preview-requested.outputs.preview_id }}
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        steps:
            - name: Is there a preview to delete?
              id: probe
              run: |
                  # Preview Workers are named <name>-<id>. When the API cannot answer, clean up anyway.
                  if RESP=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                      "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts"); then
                    FOUND=$(echo "$RESP" | jq -r --arg suffix "-${PREVIEW_ID}" '[.result[]?.id | select(endswith($suffix))] | join(" ")')
                    if [ -z "$FOUND" ]; then
                      echo "found=false" >> "$GITHUB_OUTPUT"
                      echo "No Worker ends in -${PREVIEW_ID}: nothing to delete."
                      exit 0
                    fi
                    echo "Preview Workers: ${FOUND}"
                  else
                    echo "::warning::Could not list the account's Workers; cleaning up anyway."
                  fi
                  echo "found=true" >> "$GITHUB_OUTPUT"

            - name: Checkout
              if: steps.probe.outputs.found == 'true'
              uses: actions/checkout@v7

            - name: Setup pnpm
              if: steps.probe.outputs.found == 'true'
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              if: steps.probe.outputs.found == 'true'
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: "pnpm"

            - name: Install dependencies
              if: steps.probe.outputs.found == 'true'
              run: pnpm install --frozen-lockfile --ignore-scripts=false

            - name: Delete preview workers
              if: steps.probe.outputs.found == 'true'
              run: node packages/cli/bin/otta.mjs deploy --all --delete-preview "$PREVIEW_ID"
