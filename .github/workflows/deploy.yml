name: Deploy to Cloudflare Workers

# The same deploy as everywhere else: this workflow runs `otta deploy`, as Cloudflare Workers Builds and
# a terminal do. Which apps deploy, how they build, what the build must leave, the env and the health
# path all come from each app's cloudflare-config.json; nothing here repeats them.
#
# Manual by default. Cloudflare Workers Builds is the recommended automatic deployer, and a Worker
# should have exactly one (two would deploy every push twice, possibly out of order). To deploy from
# GitHub on every push to main instead, uncomment `push:` below and leave Workers Builds disconnected.
#
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, and the placeholder values of each app's
# env.production block (D1_DATABASE_ID, KV_NAMESPACE_ID, ...). `otta deploy` takes only the names it
# needs from the secrets, and no build step or dependency ever sees the rest.
on:
    # push:
    #     branches: [main]
    workflow_dispatch:
        inputs:
            app:
                description: "An app folder (otta-web). Empty: every app whose cloudflare-config.json is deployable"
                required: false
                type: string
            force:
                description: "Deploy even when the commit message says #skipdeploy"
                required: false
                default: true
                type: boolean

permissions:
    contents: read

# Production deploys queue; a deploy in flight is never cancelled.
concurrency:
    group: production-deploy-${{ github.ref }}
    cancel-in-progress: false

jobs:
    # What to deploy and why: `otta deploy --plan`, the same decision Workers Builds and --all make.
    plan:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        outputs:
            matrix: ${{ steps.plan.outputs.matrix }}
            has-apps: ${{ steps.plan.outputs.has-apps }}
        steps:
            # Production comes from main only, whoever starts the run. A run on another branch fails and
            # says so: a skipped run would look green.
            - name: Production deploys come from main
              if: github.ref != 'refs/heads/main'
              run: |
                  echo "::error::Production deploys run from main; this run is on ${GITHUB_REF}. PR previews: pr-preview.yml."
                  exit 1

            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0 # the push range is diffed (github.event.before..HEAD)

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts=false

            - name: Plan
              id: plan
              env:
                  APP: ${{ inputs.app }} # free text: validated below, never interpolated into the script
                  FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
                  BEFORE: ${{ github.event.before }}
              run: |
                  ARGS=(deploy --plan)
                  if [ -n "$APP" ]; then
                    [[ "$APP" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "::error::app must be an apps/ folder name"; exit 1; }
                    ARGS+=("$APP")
                  else
                    ARGS+=(--all)
                  fi
                  # A push deploys what its commits changed (a first push's all-zero "before" deploys
                  # everything); a manual run deploys what it is asked to.
                  if [ "$FORCE" = "true" ]; then
                    ARGS+=(--force)
                  elif [ -n "$BEFORE" ]; then
                    ARGS+=(--changed-since "$BEFORE")
                  fi
                  MATRIX=$(node packages/cli/bin/otta.mjs "${ARGS[@]}")
                  echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
                  COUNT=$(echo "$MATRIX" | jq '.include | length')
                  echo "has-apps=$([ "$COUNT" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
                  echo "### Deploy plan" >> "$GITHUB_STEP_SUMMARY"
                  echo "$MATRIX" | jq -r '.include[] | "- **\(.app)**: \(.reason)"' >> "$GITHUB_STEP_SUMMARY"
                  [ "$COUNT" -gt 0 ] || echo "Nothing to deploy." >> "$GITHUB_STEP_SUMMARY"

    # The workspace packages, built once and cached for every app's job.
    build-packages:
        needs: plan
        if: needs.plan.outputs.has-apps == 'true'
        name: Build Packages
        uses: ./.github/workflows/build-packages.yml
        # Only the remote-cache secrets; absent => turbo runs local-only.
        secrets:
            TURBO_API: ${{ secrets.TURBO_API }}
            TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
            TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

    deploy:
        needs: [plan, build-packages]
        if: needs.plan.outputs.has-apps == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        name: Deploy ${{ matrix.app }}
        # The `production` GitHub Environment: restrict it to main and add required reviewers under Settings →
        # Environments to gate every production deploy; its link is the deployed URL.
        environment:
            name: production
            url: ${{ steps.deploy.outputs.url }}
        strategy:
            matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
            fail-fast: false # one app failing does not stop the others

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts=false

            # The packages the build-packages job built: the same key it saved under.
            - name: Restore built packages
              uses: actions/cache/restore@v6
              with:
                  path: |
                      packages/*/dist
                      packages/pro/*/dist
                      .turbo
                  key: ${{ needs.build-packages.outputs.cache-key }}
                  fail-on-cache-miss: true

            # Next.js's incremental cache, for the apps the plan says are Next.js.
            - name: Cache Next.js builds
              if: matrix.appType == 'nextjs'
              uses: actions/cache@v6
              with:
                  path: apps/${{ matrix.app }}/.next/cache
                  key: ${{ runner.os }}-nextjs-${{ matrix.app }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-nextjs-${{ matrix.app }}-${{ hashFiles('pnpm-lock.yaml') }}-
                      ${{ runner.os }}-nextjs-${{ matrix.app }}-

            # Build, check the output, fill the config, deploy, tag with the commit, health check, summary.
            # The plan already decided, hence --force. node runs the CLI directly: OTTA_DEPLOY_VALUES is read
            # and removed from the environment before anything else loads (packages/cli/bin/otta.mjs).
            - name: Deploy
              id: deploy
              env:
                  APP: ${{ matrix.app }}
                  OTTA_DEPLOY_VALUES: ${{ toJson(secrets) }}
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  NODE_ENV: production
              run: node packages/cli/bin/otta.mjs deploy "$APP" --ci --skip-packages --force
