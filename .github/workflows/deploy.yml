name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual triggers

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Deploy ${{ matrix.app }}
    strategy:
      matrix:
        app: ["@ottabase/ottabase-template-app"]
        # Add more apps here as needed, e.g. '@ottabase/app1', '@ottabase/app2'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts=false

      # Verify build tools are accessible
      - name: Verify build tools
        run: |
          echo "Verifying build tool installation..."
          echo "Node modules bin directory:"
          ls -la node_modules/.bin/ | grep -E "tsup|rimraf" || true
          echo ""
          echo "Checking PATH:"
          echo $PATH
          echo ""
          echo "Testing tsup:"
          pnpm exec tsup --version
          echo "Testing rimraf:"
          pnpm exec rimraf --version

      # Cache Turborepo outputs for faster builds
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.js', '**/*.jsx') }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-turbo-

      # Cache Next.js build for faster rebuilds
      - name: Cache Next.js
        uses: actions/cache@v4
        with:
          path: apps/*/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/**/*.ts', 'apps/**/*.tsx', 'apps/**/*.js', 'apps/**/*.jsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-

      # Extract app folder name for later steps
      - name: Set app folder name
        id: app-info
        run: |
          APP_FOLDER=$(echo "${{ matrix.app }}" | sed 's/@ottabase\///')
          echo "folder=$APP_FOLDER" >> $GITHUB_OUTPUT

      # Build packages first
      - name: Build packages
        run: |
          export PATH="${GITHUB_WORKSPACE}/node_modules/.bin:$PATH"
          echo "⏳ Building all packages using pnpm..."
          pnpm --filter "./packages/**" run build
        env:
          NODE_ENV: production

      # Build the app and all its dependencies
      - name: Build application
        run: |
          export PATH="${GITHUB_WORKSPACE}/node_modules/.bin:$PATH"
          pnpm --filter=${{ matrix.app }} run build
        env:
          NODE_ENV: production

      # Build Cloudflare Worker bundle
      - name: Build Cloudflare Worker
        working-directory: apps/${{ steps.app-info.outputs.folder }}
        run: pnpm build:worker

      # Fail fast with a concise message if production deploy secrets are missing.
      - name: Validate production deploy prerequisites
        if: github.ref == 'refs/heads/main'
        working-directory: apps/${{ steps.app-info.outputs.folder }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          CLOUDFLARE_RATE_LIMITER_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_RATE_LIMITER_NAMESPACE_ID }}
        run: |
          set -euo pipefail

          missing=0
          for k in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_D1_DATABASE_ID CLOUDFLARE_KV_NAMESPACE_ID CLOUDFLARE_RATE_LIMITER_NAMESPACE_ID; do
            if [ -z "${!k:-}" ]; then
              echo "::error::Missing required GitHub secret: $k"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "To enable production deploy:"
            echo "- Create CF resources (run locally):"
            echo "  - wrangler d1 create ottabase-db"
            echo "  - wrangler kv namespace create OBCF_KV"
            echo "  - wrangler r2 bucket create ottabase-bucket"
            echo "  - wrangler queues create ottabase-queue"
            echo "- Add GitHub Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_D1_DATABASE_ID, CLOUDFLARE_KV_NAMESPACE_ID, CLOUDFLARE_RATE_LIMITER_NAMESPACE_ID"
            exit 1
          fi

# Deploy to Cloudflare Workers
      # wrangler.jsonc uses ${CF_*} env var substitution - no file modification needed!
      - name: Deploy to Cloudflare
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        env:
          CF_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          CF_RATE_LIMITER_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_RATE_LIMITER_NAMESPACE_ID }}
          CF_KV_PREVIEW_ID: ${{ secrets.CLOUDFLARE_KV_PREVIEW_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.50.0"
          workingDirectory: apps/${{ steps.app-info.outputs.folder }}
          command: deploy --env production
